name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Prepare catalog data
        run: |
          if [ ! -f apps/storefront/public/data/catalog.json ]; then
            node scripts/build-catalog-from-sample.mjs
          fi
          if [ ! -f apps/storefront/public/data/brand.json ]; then
            node scripts/extract-brand.mjs || true
          fi
          if [ ! -f apps/storefront/public/data/content.json ]; then
            node scripts/scrape-pages.mjs || true
          fi

      - name: Install storefront deps
        working-directory: apps/storefront
        run: npm ci

      - name: Build
        working-directory: apps/storefront
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
