<!doctype html>
<html lang="fa" dir="rtl" data-theme="light" data-variant="v1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="دیجی استار کالا - فروشگاه لوازم خانگی و ابزار با تجربه خرید مدرن"
    />
    <link rel="icon" href="https://digistarkala.ir/shop/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Libre+Bodoni:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>دیجی استار کالا</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("dsk-theme-v1") || "{}");
        var st = t && t.state ? t.state : {};
        var m = st.mode === "dark" ? "dark" : "light";
        var v = st.variant || "v1";
        document.documentElement.setAttribute("data-theme", m);
        document.documentElement.setAttribute("data-variant", v);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
