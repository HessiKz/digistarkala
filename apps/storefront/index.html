<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="دیجی استار کالا - فروشگاه لوازم خانگی و ابزار با تجربه خرید مدرن"
    />
    <link rel="icon" href="https://digistarkala.ir/shop/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>دیجی استار کالا</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("dsk-theme-v1") || "{}");
        var m = t && t.state && t.state.mode === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
